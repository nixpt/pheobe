name: release

# Bumps the workspace version on every push to main (i.e. after a
# merge), then tags vX.Y.Z. Bump logic lives in scripts/bump-version.sh
# (installed by squadron/bin/bump-version --install) so it runs standalone in
# CI with no squadron/bin on PATH.
#
# branches/BUMPVER_MAIN_BRANCH below are this repo's ACTUAL default branch,
# detected at install time (not hardcoded 'main' — see squadron/bin/bump-
# version's detect_default_branch(); a repo whose default is master got a
# release job that could never fire on a real push before this).
#
# Loop-safe: pushes made with the default GITHUB_TOKEN do NOT trigger new
# workflow runs (a deliberate GitHub behavior), so the bump commit won't
# recurse. The commit message also carries [skip ci].
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch publish.yml at the tag this run mints (see below)

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.actor != 'pheobe-release'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags are needed for `git describe`
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('Cargo.toml') != ''
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Never tag a red tree: the same gate ci.yml runs, in-line, so a bump
      # cannot outrun a failing check on a direct push to main.
      - name: gate (fmt + clippy + test)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: bump + tag + push
        env:
          BUMPVER_MAIN_BRANCH: main
          BUMPVER_GIT_USER: pheobe-release
          BUMPVER_GIT_EMAIL: release@pheobe.local
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # so `gh release create` inside the script authenticates
        run: ./scripts/bump-version.sh

      # A tag pushed with GITHUB_TOKEN does NOT raise a push event (the same
      # recursion guard that keeps the bump commit from re-running this job),
      # so publish.yml's `on: push: tags` never sees a bot-minted tag.
      # workflow_dispatch is the documented exception — dispatch it by hand
      # at exactly the tag just created. No new tag → nothing to publish.
      - name: dispatch publish at the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          case "$tag" in
            v[0-9]*)
              echo "dispatching publish.yml at $tag"
              gh workflow run publish.yml --ref "$tag" ;;
            *)
              echo "no version minted by this run — nothing to publish" ;;
          esac
