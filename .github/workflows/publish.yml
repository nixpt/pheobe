name: publish

# Publish the tagged commit to crates.io. Tags are minted by release.yml
# (bump-version on feat:/fix:/breaking merges) or pushed by hand; either way
# this publishes exactly the commit the tag points at, never a moving main.
#
# Safe to re-run: a version already on crates.io is skipped, not re-uploaded.
#
# Auth, in order:
#   1. crates.io Trusted Publishing (OIDC, no stored secret) — configure once
#      on crates.io: crate settings → Trusted Publishing → GitHub,
#      repository nixpt/pheobe, workflow publish.yml.
#   2. Fallback: a CARGO_REGISTRY_TOKEN repository secret (scoped token,
#      publish-update only, crate pheobe).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      verify_auth:
        description: "Only prove the crates.io Trusted Publishing exchange works (no publish)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # trusted publishing needs the OIDC token

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: tag must match Cargo.toml version
        id: ver
        run: |
          ver="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag="${GITHUB_REF_NAME#v}"
              if [ "$tag" != "$ver" ]; then
                echo "::error::tag v$tag does not match Cargo.toml version $ver"
                exit 1
              fi ;;
            *)
              echo "manual run on $GITHUB_REF_NAME — publishing Cargo.toml version $ver" ;;
          esac

      - name: skip if this version is already on crates.io
        id: exists
        run: |
          ver="${{ steps.ver.outputs.version }}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'pheobe publish workflow (github actions)' \
            "https://crates.io/api/v1/crates/pheobe/$ver")"
          if [ "$code" = "200" ]; then
            echo "pheobe $ver is already published — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "pheobe $ver not on crates.io (HTTP $code) — will publish"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: package (list contents, verify build)
        if: steps.exists.outputs.skip != 'true'
        run: |
          cargo package --list
          cargo publish --dry-run

      - name: crates.io trusted publishing token
        if: steps.exists.outputs.skip != 'true' || inputs.verify_auth == true
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
        continue-on-error: true # falls back to the CARGO_REGISTRY_TOKEN secret below

      - name: report trusted publishing status (verify_auth)
        if: inputs.verify_auth == true
        env:
          TP_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ -n "$TP_TOKEN" ]; then
            echo "trusted publishing OK: crates.io issued a short-lived token to this workflow (length ${#TP_TOKEN})"
          else
            echo "::error::trusted publishing FAILED: crates.io did not issue a token — check the crate's Trusted Publishing config (repo nixpt/pheobe, workflow publish.yml)"
            exit 1
          fi

      - name: cargo publish
        if: steps.exists.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::no crates.io credential: configure Trusted Publishing for publish.yml or add a CARGO_REGISTRY_TOKEN secret"
            exit 1
          fi
          cargo publish --no-verify
