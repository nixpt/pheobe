# ci — format, lint and test on every push and PR.
#
# pheobe has no path or git deps (RULES.md §5), so this job is plain: no
# tokens, no sibling checkouts. release.yml runs the same three commands
# before it bumps, so a red tree is never tagged.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Package (crates.io readiness)
        run: cargo package --no-verify
