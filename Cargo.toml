[package]
name = "pheobe"
version = "1.1.0"
description = "A coding workhorse with no face. Task in, worktree branch + handoff report out."
edition = "2021"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/nixpt/pheobe"
keywords = ["agent", "subagent", "coding-agent", "harness"]
categories = ["command-line-utilities", "development-tools"]
# src/, persona/, adopt/, knowledge/ (seed corpus) ship; the fleet planning
# dir, release CI, and repo-local kit do not.
exclude = [".jagent", ".github", "scripts", ".gitignore", "docs", ".dejavue", ".gitattributes", "CLAUDE.md", "AGENTS.md", "CONTRIBUTING.md"]

[[bin]]
name = "pheobe"
path = "src/main.rs"

# CARGO_BIN_EXE_* is injected for integration tests, not `#[cfg(test)]`
# modules. This file sits with the rest of the suite under src/tests/ but
# is its own target — do not `mod cli` from tests.rs.
[[test]]
name = "cli"
path = "src/tests/cli.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wait-timeout = "0.2.1"
agent-client-protocol = { version = "1.2", features = ["unstable"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
